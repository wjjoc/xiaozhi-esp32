name: Build Meibao 175C 32MB
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Custom partition table (assets 16MB)
        shell: bash
        run: |
          cat > partitions_meibao.csv <<'CSV'
          # Name,   Type, SubType, Offset,   Size,     Flags
          nvs,      data, nvs,     0x9000,   0x4000,
          otadata,  data, ota,     0xd000,   0x2000,
          phy_init, data, phy,     0xf000,   0x1000,
          ota_0,    app,  ota_0,   0x20000,  0x3f0000,
          ota_1,    app,  ota_1,   0x410000, 0x3f0000,
          assets,   data, spiffs,  0x800000, 0x1000000,
          CSV
          sed -i 's/^ *//' partitions_meibao.csv
          echo "=== partitions_meibao.csv ==="
          cat partitions_meibao.csv

      - name: Configure
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py waveshare/esp32-s3-touch-amoled-1.75 --name esp32-s3-touch-amoled-1.75c --language zh-CN --wake-word disabled
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("sdkconfig")
          s = p.read_text()
          def setkv(s, k, v):
              s = re.sub(rf"^{re.escape(k)}=.*\n", "", s, flags=re.M)
              s = re.sub(rf"^# {re.escape(k)} is not set\n", "", s, flags=re.M)
              return s + f"{k}={v}\n"
          # 32MB flash so the partition table may exceed 16MB
          s = setkv(s, "CONFIG_ESPTOOLPY_FLASHSIZE", '"32MB"')
          s = setkv(s, "CONFIG_ESPTOOLPY_FLASHSIZE_32MB", "y")
          s = setkv(s, "CONFIG_PARTITION_TABLE_CUSTOM", "y")
          s = setkv(s, "CONFIG_PARTITION_TABLE_CUSTOM_FILENAME", '"partitions_meibao.csv"')
          # custom wake word, unchanged from the board currently running
          s = setkv(s, "CONFIG_WAKE_WORD_DISABLED", "n")
          s = setkv(s, "CONFIG_USE_AFE_WAKE_WORD", "n")
          s = setkv(s, "CONFIG_USE_CUSTOM_WAKE_WORD", "y")
          s = setkv(s, "CONFIG_CUSTOM_WAKE_WORD", '"ni hao mei bao"')
          s = setkv(s, "CONFIG_CUSTOM_WAKE_WORD_DISPLAY", '"ni hao mei bao"')
          s = setkv(s, "CONFIG_CUSTOM_WAKE_WORD_THRESHOLD", "40")
          s = setkv(s, "CONFIG_SR_MN_CN_MULTINET7_QUANT", "y")
          p.write_text(s)
          print("=== injected ===")
          print("\n".join(l for l in s.splitlines()
                          if any(k in l for k in ("FLASHSIZE", "PARTITION_TABLE", "WAKE_WORD"))))
          PY

      - name: Build
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py build 2>&1 | tail -30
          idf.py merge-bin
          ls -l build/merged-binary.bin
          echo "=== verify flash size + partition table in image ==="
          python - <<'PY'
          import struct
          d = open("build/merged-binary.bin", "rb").read()
          flash_mb = d[3]      # header byte 3: flash size code
          print("header flash-size code:", hex(flash_mb), "(0x20=32MB, 0x10=16MB)")
          off = 0x8000
          for i in range(12):
              e = d[off + i*32: off + (i+1)*32]
              magic, typ, sub, o, size = struct.unpack("<HBBII", e[:12])
              if magic != 0x50AA:
                  break
              print("  ", e[12:28].rstrip(b"\x00").decode(), f"off={o:#x} size={size:#x}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: meibao-175c-32m
          path: |
            build/merged-binary.bin
            sdkconfig
            partitions_meibao.csv
          if-no-files-found: error
